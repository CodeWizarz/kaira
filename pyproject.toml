[project]
name = "kaira"
version = "0.1.0"
description = "High-performance data ingestion pipeline for Indian index options (NIFTY / BANKNIFTY)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=0.10.0",
  "httpx>=0.27.0",
  "hmmlearn>=0.3.0",
  "numpy>=1.26.0",
  "orjson>=3.9.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.0.0",
  "scikit-learn>=1.4.0",
  "tenacity>=8.0.0",
  "typer>=0.12.0",
]

[project.scripts]
kaira = "kaira.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
